name: shorts
on:
  workflow_dispatch:
    inputs: {dry: {description: "so simular", default: "false"}}
  schedule:
    - cron: "0 12 * * *"   # 09:00 BRT: agenda ate 5 Shorts por execucao, 2 por dia a partir do ultimo slot (11:00 e 20:00 ET)
permissions: {contents: write}
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, path: main}
      - uses: actions/checkout@v4
        with: {ref: shorts-media, path: media}
      - run: pip install google-api-python-client google-auth
      - name: agendar
        working-directory: media
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python ../main/shorts-verticais/postar_shorts.py . ordem.md --n 5 $([ "${{ inputs.dry }}" = "true" ] && echo --dry)
      - name: salvar estado
        working-directory: media
        run: |
          git config user.name shorts-bot; git config user.email bot@users.noreply.github.com
          python3 -c "import json,os;[os.remove(f) for f in json.load(open('posted.json')) if os.path.exists(f)]"; git add -A && git commit -m "estado shorts" && git push || true
