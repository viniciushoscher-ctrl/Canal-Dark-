name: shorts
on:
  workflow_dispatch:
    inputs: {dry: {description: "so simular", default: "false"}, n: {description: "quantos", default: "5"}}
  schedule:
    - cron: "0 12 * * *"   # 09:00 BRT: agenda ate 5 Shorts por execucao, 5 por dia nos proximos slots livres (09,12,15,19,21h ET) (11:00 e 20:00 ET)
permissions: {contents: write}
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, path: main}
      - uses: actions/checkout@v4
        with: {ref: shorts-media, path: media}
      - run: pip install google-api-python-client google-auth
      - name: agendar
        working-directory: media
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python ../main/shorts-verticais/postar_shorts.py . ordem.md --n ${{ inputs.n || 5 }} $([ "${{ inputs.dry }}" = "true" ] && echo --dry)
      - name: salvar estado
        working-directory: media
        run: |
          git config user.name shorts-bot; git config user.email bot@users.noreply.github.com
          python3 -c "import json,os;[os.remove(f) for f in json.load(open('posted.json')) if os.path.exists(f)]"; git add -A && git commit -m "estado shorts" && git push || true
