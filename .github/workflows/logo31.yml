name: logo31
on:
  workflow_dispatch:
  push:
    branches: [gerar-imagens-video1]
    paths: ['video31-imagens/logos.txt', 'assets4/logo.py']
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 assets4/logo.py video31-imagens/logos.txt video31-commons/logos || true
      - if: always()
        run: |
          git config user.name Claude && git config user.email noreply@anthropic.com
          git add video31-commons && git commit -m "logos video 31 [skip ci]" && for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 5; done
