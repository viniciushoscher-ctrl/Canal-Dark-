name: commons27
on:
  workflow_dispatch:
  push:
    branches: [gerar-imagens-video1]
    paths: ['video27-imagens/commons.txt']
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          python shorts/commons.py video27-imagens/commons.txt video27-commons/fotos || true
          python shorts/commons.py video27-imagens/maps.txt video27-commons/mapa || true
      - if: always()
        run: |
          git config user.name Claude && git config user.email noreply@anthropic.com
          git add video27-commons && git commit -m "Commons video 4 [skip ci]" && for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 5; done
