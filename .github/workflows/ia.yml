name: ia
on:
  push:
    branches: [gerar-imagens-video1]
    paths: ['pipeline/gen/run_ia.txt', 'assets4/ia_footage.py']
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        n: [14, 15, 16, 17, 18, 19, 20]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg
      - run: python3 assets4/ia_footage.py video${{ matrix.n }}-imagens/ia.txt video${{ matrix.n }}-footage-ia || true
      - if: always()
        run: |
          git config user.name Claude && git config user.email noreply@anthropic.com
          git add video${{ matrix.n }}-footage-ia && git commit -m "Clipes Internet Archive V${{ matrix.n }} [skip ci]" && for i in 1 2 3 4 5 6; do git pull --rebase -q && git push && break; sleep $((RANDOM%8+3)); done
