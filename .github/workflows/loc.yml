name: loc
on:
  workflow_dispatch:
  push:
    branches: [gerar-imagens-video1]
    paths: ['pipeline/gen/run_loc.txt']
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        n: [14, 15, 16, 17, 18, 19, 20]
    steps:
      - uses: actions/checkout@v4
      - run: python shorts/loc_nasa.py video${{ matrix.n }}-imagens/commons_f.txt video${{ matrix.n }}-commons/loc || true
      - if: always()
        run: |
          git config user.name Claude && git config user.email noreply@anthropic.com
          git add video${{ matrix.n }}-commons && git commit -m "LoC/NASA video ${{ matrix.n }} [skip ci]" && for i in 1 2 3 4 5 6; do git pull --rebase -q && git push && break; sleep $((RANDOM % 10 + 3)); done
