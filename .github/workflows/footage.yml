name: footage
on:
  workflow_dispatch:
  push:
    branches: [gerar-imagens-video1]
    paths: ['footage/fetch.py']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg
      - run: python3 footage/fetch.py
      - if: always()
        run: |
          git config user.name Claude && git config user.email noreply@anthropic.com
          git add footage && git commit -m "Footage de arquivo [skip ci]" && for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 5; done
