name: media
on:
  workflow_dispatch:
  push:
    branches: [gerar-imagens-video1]
    paths: ['pipeline/gen/run_media.txt']
permissions:
  contents: write
jobs:
  m:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - id: nn
        run: echo "n=$(head -1 pipeline/gen/run_media.txt | tr -d ' \n')" >> $GITHUB_OUTPUT
      - run: sudo apt-get install -y -qq ffmpeg
      - run: python shorts/commons2.py video${{ steps.nn.outputs.n }}-imagens/commons_f.txt video${{ steps.nn.outputs.n }}-commons/f || true
      - run: python3 assets4/ia_footage.py video${{ steps.nn.outputs.n }}-imagens/ia.txt video${{ steps.nn.outputs.n }}-footage-ia || true
      - env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python3 assets4/pixabay_footage.py video${{ steps.nn.outputs.n }}-imagens/ia.txt video${{ steps.nn.outputs.n }}-footage-px || true
      - if: always()
        run: |
          git config user.name Claude && git config user.email noreply@anthropic.com
          git add video${{ steps.nn.outputs.n }}-commons video${{ steps.nn.outputs.n }}-footage-ia video${{ steps.nn.outputs.n }}-footage-px && git commit -m "Midia V${{ steps.nn.outputs.n }} [skip ci]" && for i in 1 2 3 4 5 6; do git pull --rebase -q && git push && break; sleep $((RANDOM%8+3)); done
